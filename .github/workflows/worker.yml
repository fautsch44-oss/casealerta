# Publica el Worker de Cloudflare (MCP + API citable) cada vez que cambia su código o el catálogo.
# Requiere el secreto CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare Workers"). CLOUDFLARE_ACCOUNT_ID es opcional.
# Sin el token, el flujo prueba el paquete y se salta la publicación (no falla).
name: Worker MCP (Cloudflare)
on:
  push:
    branches: [main]
    paths: ['worker/**', 'site/lib/**', 'site/data/**', 'web/src/news/**', '.github/workflows/worker.yml']
  workflow_dispatch:
concurrency: { group: worker-mcp, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Probar el paquete (datos + empaquetado + 18 pruebas de protocolo)
        run: npm test
      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::Falta CLOUDFLARE_API_TOKEN: se probó el Worker pero no se publicó."; exit 0; fi
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Worker publicado: $url" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$url" ] && curl -sf "$url/salud" && echo
