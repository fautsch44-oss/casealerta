# Worker de Cloudflare de CaseAlerta: servidor MCP público + API citable.
# casealerta.com/mcp/ y casealerta.com/api/v1/ llegan aquí reenviados por Vercel (MCP_WORKER_ORIGIN).
name = "casealerta-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

# Los datos del catálogo van empaquetados (no hay disco en Workers).
[alias]
"@/lib/catalog-data" = "./build/catalog-data.ts"
